name: Mi primer workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint: # Analisis de sintaxis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: install dependencies
        run: |
          pip install -r requirements.txt
      - name: run flake8
        run: |
          flake8 --exclude=venv* --statistics


  matrix_tests: # Ejecutar tests en diferentes versiones de Python
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Si falla una version, las demas siguen
      matrix: 
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          cache: pip
          python-version: ${{ matrix.python-version }}
      - name: install dependencies
        run: |
          pip install -r requirements.txt
      - name: run tests with coverage
        run: |
          pytest --cov=saludar --cov-report=term-missing --cov-fail-under=80
  

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          cache: pip
          python-version: "3.14"
      - name: install dependencies
        run: |
          pip install -r requirements.txt
      - name: run security Analisis
        run: |
          bandit -r saludar.py
  

  docker: # CD
    runs-on: ubuntu-latest
    needs: [lint, matrix_tests, security]
    if: github.event_name == 'push' && github.ref_name == 'main'
    steps:
      - uses: actions/checkout@v4
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PWD }}
      - name: Publish to docker hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: imontalvodev/mi-primer-pipeline:latest

      
