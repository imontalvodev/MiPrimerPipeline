name: Mi primer workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint: # Analisis de sintaxis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: install dependencies
        run: |
          pip install -r requirements.txt
      - name: run tests
        run: |
          flake8 --exclude=venv* --statistics


  test: # Ejecutar tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: install dependencies
        run: |
          pip install -r requirements.txt
      - name: run tests
        run: |
          pytest -v
